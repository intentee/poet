[workspace]
resolver = "3"
members = [
    "poet",
    "poet_assets",
    "poet_assets_tests",
    "poet_content",
    "poet_content_tests",
    "poet_filesystem",
    "poet_filesystem_tests",
    "poet_mcp",
    "poet_mcp_tests",
    "poet_mdx",
    "poet_mdx_tests",
    "poet_search",
    "poet_search_tests",
    "rhai_components",
    "rhai_components_tests",
]

[workspace.package]
edition = "2024"
homepage = "https://poet.intentee.com/"
license = "Apache-2.0"
repository = "https://github.com/intentee/poet"
version = "0.8.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
allow_attributes = "deny"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
dbg_macro = "deny"
error_impl_error = "allow"
expect_used = "deny"
future_not_send = "allow"
infinite_loop = "deny"
literal_string_with_formatting_args = "allow"
missing_docs_in_private_items = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
rc_mutex = "deny"
rest_pat_in_fully_bound_structs = "deny"
self_named_module_files = "deny"
significant_drop_tightening = "allow"
str_to_string = "deny"
tests_outside_test_module = "allow"
todo = "deny"
too_many_arguments = "allow"
too_many_lines = "allow"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.dependencies]
actix-files = "0.7"
actix-http = "3.18"
actix-web = "4.15"
actix-ws = "0.4"
anyhow = { version = "1.0", features = ["backtrace"] }
async-stream = "0.3"
async-trait = "0.1"
base64 = { version = "0.23", default-features = false, features = ["std"] }
blake3 = "1.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
dashmap = "6.2"
env_logger = "0.11"
esbuild-metafile = "0.10"
freedesktop_entry_parser = "2.0"
futures-core = "0.3"
futures-util = "0.3"
http = "1.5"
indoc = "2.0"
itertools = "0.15"
log = "0.4"
markdown = "1.0"
mime = "0.3"
mime_guess = "2.0"
nom = "8.0"
notify-debouncer-full = "0.7"
petgraph = { version = "0.8", features = ["serde", "serde_derive"] }
poet_assets = { path = "poet_assets", version = "0.8" }
poet_content = { path = "poet_content", version = "0.8" }
poet_content_tests = { path = "poet_content_tests" }
poet_filesystem = { path = "poet_filesystem", version = "0.8" }
poet_mcp = { path = "poet_mcp", version = "0.8" }
poet_mdx = { path = "poet_mdx", version = "0.8" }
poet_search = { path = "poet_search", version = "0.8" }
poet_search_tests = { path = "poet_search_tests" }
rayon = "1.12"
rhai = { version = "1.26", features = ["internals", "metadata", "no_closure", "serde", "serde_json", "sync"] }
rhai_components = { path = "rhai_components", version = "0.6" }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sitemap-rs = "0.7"
slug = "0.1"
syntect = "5.3"
tantivy = "0.26"
thiserror = "2.0"
tempfile = "3.27"
tokio = { version = "1.53", features = ["full"] }
tokio-util = "0.7"
toml = "1.1"
url = "2.5"
uuid = { version = "1.26", features = ["rng", "serde", "v4"] }
