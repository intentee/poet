name: unit tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup rust
        uses: ./.github/actions/setup-rust

      - name: run tests
        run: make test

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup rust
        uses: ./.github/actions/setup-rust

      - name: run clippy
        run: make clippy

  install:
    name: install
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup rust
        uses: ./.github/actions/setup-rust

      - name: install poet
        run: make install
        env:
          CARGO_INSTALL_ROOT: ${{ runner.temp }}/poet-install

      - name: run installed poet
        run: ${{ runner.temp }}/poet-install/bin/poet --version
