[workspace]
resolver = "3"
members = [
    "poet",
    "rhai_components",
]

[workspace.dependencies]
actix = "0.13"
actix-cors = "0.7"
actix-files = "0.7"
actix-rt = "2.15"
actix-web = "4.15"
actix-ws = "0.4"
anyhow = { version = "1.0", features = ["backtrace"] }
async-stream = "0.3"
async-trait = "0.1"
base64 = "0.23"
blake3 = "1.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
dashmap = "6.2"
env_logger = "0.11"
esbuild-metafile = "0.10"
freedesktop_entry_parser = "2.0"
futures-core = "0.3"
futures-util = "0.3"
http = "1.5"
http-serde = "2.1"
indoc = "2.0"
itertools = "0.15"
log = "0.4"
markdown = "1.0"
mime = "0.3"
mime_guess = "2.0"
nom = "8.0"
notify = "8.2"
notify-debouncer-full = "0.7"
petgraph = { version = "0.8", features = ["serde", "serde_derive"] }
rayon = "1.12"
rhai = { version = "1.26", features = ["internals", "metadata", "no_closure", "serde", "serde_json", "sync"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sitemap-rs = "0.7"
slug = "0.1"
syntect = "5.3"
tantivy = "0.26"
tokio = { version = "1.53", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
toml = "1.1"
url = "2.5"
uuid = { version = "1.26", features = ["rng", "serde", "v4"] }
